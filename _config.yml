# Set theme
remote_theme: daviddarnes/alembic@main
# theme: alembic-jekyll-theme
# File excludes
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

css_inline: true

# Set plugins
plugins:
  - jekyll-sitemap
  - jekyll-mentions
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-commonmark
  - jekyll-include-cache
  - jemoji
  - jekyll-remote-theme

# Site settings
url: "https://sunildeshpande4you.github.io"
# baseurl: ""
title: "Sunil Deshpande — Infrastructure, Cloud & DevOps Notes"
description: "17+ years of hands-on IT infrastructure, cloud (AWS/Azure), Kubernetes, DevOps, and IT security experience — shared through articles, how-to guides, and evaluations."
permalink: pretty
# logo: ""

# Pagination
paginate: 5
paginate_path: blog/page:num

# Header nav
navigation_header:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: Blog
    url: /blog/
  - title: Guides
    url: /guides/
  - title: Evaluations
    url: /evaluations/

# Footer nav
navigation_footer:
  - title: Back to top
    url: "#top"

# Collections
collections:
  posts:
    title: Posts
    output: true
    # description: "My thoughts, learnings, experience"
    # feature_text: |
    #   Welcome to my blog
    # feature_image: ""
  evaluations:
    title: Evaluations
    output: true
    permalink: /evaluations/:path/
    description: "Hands-on comparisons and evaluations of tools, platforms, and approaches."
  guides:
    title: How-To Guides
    output: true
    permalink: /guides/:path/
    description: "Step-by-step guides drawn from real-world infrastructure and cloud work."

# Collection settings
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post # Set the default layout for posts
      author: "Sunil Deshpande"
  - scope:
      path: ""
      type: "evaluations"
    values:
      layout: post # Reuses the existing post layout — no new layout file needed
      author: "Sunil Deshpande"
      category: "evaluations"
  - scope:
      path: ""
      type: "guides"
    values:
      layout: post # Reuses the existing post layout — no new layout file needed
      author: "Sunil Deshpande"
      category: "how-to-guide"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page # Set the default layout for pages
